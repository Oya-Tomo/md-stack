[package]
name = "md-stack"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false }
notify = "8.2.0"
pulldown-cmark = "0.13.4"
ratatui = "0.30.2"
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
resvg = "0.48.1"
rmcp = { version = "3.5.0", features = ["server", "transport-io", "macros", "schemars"] }
rquickjs = "0.14.0"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "sync"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2.2"
